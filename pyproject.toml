[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusai"
version = "0.1.0"
description = "NexusAI Foundation v0.1 core structure."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Damien" }
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
nexusai = "nexusai_core.main:main"
nexusai-gateway = "nexusai_core.local_gateway.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
