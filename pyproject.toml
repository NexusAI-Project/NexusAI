[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusai"
version = "0.1.0"
description = "NexusAI Foundation v0.1 core structure."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Damien" }
]
dependencies = []

[project.scripts]
nexusai = "nexusai_core.main:main"

[tool.setuptools.packages.find]
where = ["src"]
